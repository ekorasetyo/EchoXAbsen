name: Build scanlog.exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: 2.2.6
          with-cache: true

      - name: Build
        run: lazbuild --build-mode=Default scanlog.lpi

      - name: Siapkan paket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item scanlog.exe dist/
          Copy-Item contoh_scanlog.csv dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ScanlogImporter-win32
          path: dist/

      - name: Release (jika tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/scanlog.exe
