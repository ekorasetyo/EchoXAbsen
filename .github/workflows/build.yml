name: Build scanlog.exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: 2.2.6
          with-cache: true

      - name: Cari proyek dan build
        shell: pwsh
        run: |
          $lpi = Get-ChildItem -Recurse -Filter scanlog.lpi | Select-Object -First 1
          if (-not $lpi) {
            Write-Host "scanlog.lpi tidak ditemukan. Isi repo:"
            Get-ChildItem -Recurse -File | ForEach-Object { $_.FullName }
            throw "scanlog.lpi tidak ada di repo"
          }
          Write-Host "Proyek: $($lpi.FullName)"
          lazbuild --build-mode=Default $lpi.FullName
          if ($LASTEXITCODE -ne 0) { throw "lazbuild gagal" }

      - name: Siapkan paket
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Recurse -Filter scanlog.exe | Select-Object -First 1
          if (-not $exe) { throw "scanlog.exe tidak ditemukan" }
          Copy-Item $exe.FullName dist/
          Get-ChildItem -Recurse -Filter contoh_scanlog.csv | Select-Object -First 1 | Copy-Item -Destination dist/
          Get-ChildItem -Recurse -Filter README.md | Select-Object -First 1 | Copy-Item -Destination dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ScanlogImporter-win
          path: dist/

      - name: Release (jika tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/scanlog.exe
